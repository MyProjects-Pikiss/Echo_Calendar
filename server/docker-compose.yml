services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: echo-calendar-kafka
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    volumes:
      - kafka_apache_data:/tmp/kraft-combined-logs
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: echo-calendar-backend
    depends_on:
      - kafka
    env_file:
      - ./docker.defaults.env
      - ${BACKEND_EXTERNAL_ENV_PATH:?set BACKEND_EXTERNAL_ENV_PATH in server/.env}
    ports:
      - "8088:8088"
    volumes:
      - type: bind
        source: ${BACKEND_DATA_DIR:?set BACKEND_DATA_DIR in server/.env}
        target: /app/data
      - type: bind
        source: ${BACKEND_DOWNLOADS_DIR:?set BACKEND_DOWNLOADS_DIR in server/.env}
        target: /app/downloads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  usage-consumer:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: echo-calendar-usage-consumer
    depends_on:
      - kafka
    command:
      - python
      - scripts/consume_usage_events.py
    env_file:
      - ./docker.defaults.env
      - ${BACKEND_EXTERNAL_ENV_PATH:?set BACKEND_EXTERNAL_ENV_PATH in server/.env}
    volumes:
      - type: bind
        source: ${BACKEND_DATA_DIR:?set BACKEND_DATA_DIR in server/.env}
        target: /app/data
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: echo-calendar-cloudflared
    profiles:
      - tunnel
    depends_on:
      - backend
    command:
      - tunnel
      - --config
      - /etc/cloudflared/config.yml
      - run
    volumes:
      - type: bind
        source: ${CLOUDFLARED_DIR:?set CLOUDFLARED_DIR in server/.env}
        target: /etc/cloudflared
        read_only: true
    restart: unless-stopped

volumes:
  kafka_apache_data:
